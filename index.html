<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de Asistencia</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />

    <style>
      .h2 {
        text-shadow: none;
      }
      thead {
        background-color: #f8f9fa;
        border: 1px solid #dee2e6;
      }
      .btn {
        background-color: black;
        color: #dee2e6;
      }
      .btn:hover {
        background-color: grey;
      }
      label {
        font-style: italic;
        color: #444;
        font-weight: 500;
      }
      .subtitulo {
        font-size: 1rem;
        font-weight: 400;
        color: #666;
      }
    </style>
  </head>

  <body>
    <main class="container">
      <!-- Título principal -->
      <div class="row text-center mt-5">
        <h1 class="title"><strong>Registro de Asistencia</strong></h1>
        <h2 class="subtitulo">
          Mantén un seguimiento de la asistencia de tus alumnos en clase.
        </h2>
      </div>

      <!-- Tabla de alumnos -->
      <div class="card border-0 shadow-none my-4">
        <div class="card-header bg-transparent border-0 px-0">
          <h3 class="mb-0">Lista de Alumnos</h3>
        </div>
        <div class="card-body px-0">
          <table class="table">
            <thead>
              <tr>
                <th>Foto</th>
                <th>Nombre</th>
                <th>Apellidos</th>
                <th>DNI</th>
                <th>Teléfono</th>
                <th>Asistencia</th>
              </tr>
            </thead>
            <tbody id="listaAlumnos"></tbody>
          </table>
        </div>
      </div>

      <!-- Formulario para agregar alumno -->
      <div class="card border-0 shadow-none my-1">
        <div class="card-header bg-transparent border-0 px-0">
          <h3 class="mb-0">Agregar Alumno</h3>
        </div>
        <div class="card-body px-0">
          <form id="formularioAlumno" class="mt-0">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input
                  type="text"
                  class="form-control"
                  id="nombre"
                  required
                  placeholder="Introduce el nombre"
                  aria-label="Nombre del alumno"
                  autofocus
                />
              </div>
              <div class="col-md-6 mb-3">
                <label for="apellidos" class="form-label">Apellidos</label>
                <input
                  type="text"
                  class="form-control"
                  id="apellidos"
                  required
                  placeholder="Introduce los apellidos"
                  aria-label="Apellidos del alumno"
                />
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="dni" class="form-label">DNI</label>
                <input
                  type="text"
                  class="form-control"
                  id="dni"
                  required
                  placeholder="Introduce el DNI"
                  aria-label="DNI del alumno"
                />
              </div>
              <div class="col-md-6 mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input
                  type="tel"
                  class="form-control"
                  id="telefono"
                  required
                  placeholder="Introduce el teléfono"
                  aria-label="Teléfono del alumno"
                />
              </div>
            </div>

            <button type="submit" class="btn w-100">Agregar Alumno</button>
          </form>
        </div>
      </div>
    </main>
    <script src="js/bootstrap.bundle.js"></script>
    <script src="script.js"></script>
  </body>
</html>
